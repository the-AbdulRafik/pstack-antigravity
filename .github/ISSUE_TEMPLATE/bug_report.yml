name: Bug Report
description: Report an issue or broken skill in pstack-antigravity
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide reproduction details below.
  - type: input
    id: skill
    attributes:
      label: Affected Skill or Subagent
      description: e.g. poteto-mode, comment-sicko, thermo-nuclear-review
      placeholder: poteto-mode
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Prompt & Behavior
      description: What prompt was sent and what incorrect behavior occurred?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen per pstack invariants?
    validations:
      required: true
