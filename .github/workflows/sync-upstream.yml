name: Upstream Sync Check

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-upstream:
    name: Check for Upstream Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Upstream Release Metadata
        run: |
          echo "Checking upstream pstack releases..."
          curl -s https://api.github.com/repos/michael-denyer/pstack-claude/releases/latest > upstream-latest.json
          cat upstream-latest.json | grep "tag_name" || echo "No tag found"
